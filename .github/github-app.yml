instructions: |
  MochiBot is a single-owner companion and a personal learning project.
  Optimize for relationship continuity, reliable memory, and Main's agency,
  with the smallest complete implementation that solves the current problem.
  Explain product impact and meaningful tradeoffs in plain language.

  One request has one responsible session. Work independently by default.
  Do not create or fork sessions, delegate to agents, or initiate cross-session
  messages unless the owner explicitly requests that collaboration. Multiple
  open windows or an unsolicited message do not authorize a coordination loop.
  Requested collaboration stays bounded to its task, without further handoffs
  or repeated peer reviews.

  Deliver completed changes directly to main by default, without creating feature
  branches or pull requests unless the owner asks. If the app already provides
  an isolated worktree branch, commit there and integrate into main as part of
  delivery; do not leave routine merging to the owner. Fetch main before editing
  and again before delivery, preserve concurrent work, and verify the push.
  Resolve merges when both intentions are clear; ask only when a real conflict
  requires a product decision. Never overwrite others' work, rewrite history,
  or force-push. Releases, tags and production deployments still require
  explicit owner approval.

  Read docs/architecture.md for runtime boundaries and dependency direction.
  Use docs/SKILL_SPEC.md for skill contracts and CONTRIBUTING.md for development
  entry points. Keep architecture.md as the single high-level architecture
  document; update it when boundaries or major data flows change, not as a
  progress log. If documentation and code disagree, trace the actual behavior
  and surface the discrepancy rather than treating either as proof of intent.

  Main owns personality, meaning, priorities, and voluntary action. The harness
  supplies usable context, capabilities, and real execution boundaries.
  Agent First means both avoiding substituted judgment and giving Main enough
  information and continuity to exercise judgment. More activity or fewer
  constraints alone do not establish better agency.

  Before adding infrastructure, trace the problem through existing paths and
  compare reuse with the proposed addition. Account for model calls, context,
  latency, duplicated state, and maintenance burden, not just lines of code.
  Discuss material changes to user experience, autonomy, memory visibility, or
  persistent ownership before implementation. Do not quietly expand scope.

  Review correctness, Agent First and proportionality in the current session.
  There is no mandatory reviewer or second-agent approval step. Invoke
  .github/agents/agent-first-reviewer.agent.md only when the owner explicitly
  asks for that reviewer; a general request to review means review it yourself.

  Validate changed behavior with existing targeted tests and affected
  boundaries. Keep runtime data and real model calls out of ordinary checks.
  Do not edit personal/global agent configuration for a project-local change.
