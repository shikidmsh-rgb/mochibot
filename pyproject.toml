[project]
name = "mochibot"
version = "1.0.9"
description = "A lightweight AI companion framework with autonomous heartbeat, layered memory, and modular skills."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai", "agent", "companion", "chatbot", "memory", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.39.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "ddgs>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "cryptography>=42.0.0",
    "sqlite-vec>=0.1.6",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/shikidmsh-rgb/mochibot"
Repository = "https://github.com/shikidmsh-rgb/mochibot"
Issues = "https://github.com/shikidmsh-rgb/mochibot/issues"
