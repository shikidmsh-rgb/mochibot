<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍡 MochiBot 管理后台</title>
<style>
:root {
  --primary: #D4785C;
  --primary-hover: #B8604A;
  --primary-bg: #FDF5F2;
  --dango-pink: #E8A0BF;
  --dango-green: #7BAE7F;
  --bg: #FAF7F4;
  --card: #FFFFFF;
  --text: #4A4543;
  --text-heading: #2D2926;
  --text-soft: #9A9593;
  --border: #E8DDD4;
  --success: #7BAE7F;
  --danger: #C9544D;
  --warning: #D4A84C;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(180,96,74,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }
/* ── Sidebar ─────────────────────────── */
.sidebar { width:220px; background:var(--card); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:10; }
.sidebar-header { padding:20px 16px 12px; border-bottom:1px solid var(--border); text-align:center; }
.sidebar-header h1 { font-size:18px; color:var(--text-heading); }
.sidebar-header .logo { font-size:32px; display:block; margin-bottom:4px; }
.sidebar-nav { flex:1; padding:12px 8px; }
.nav-item { display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--text); border:none; background:none; width:100%; text-align:left; transition:background .15s; }
.nav-item:hover { background:var(--primary-bg); }
.nav-item.active { background:var(--primary-bg); color:var(--primary); font-weight:600; }
.nav-icon { font-size:16px; width:20px; text-align:center; }
/* ── Content ─────────────────────────── */
.content { margin-left:220px; flex:1; padding:24px 32px; max-width:1100px; }
.page { display:none; }
.page.active { display:block; }
.page-title { font-size:22px; font-weight:700; color:var(--text-heading); margin-bottom:20px; }
/* ── Cards ────────────────────────────── */
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
.card-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--text-soft); margin-bottom:12px; }
.card-row { display:flex; gap:16px; }
.card-row > .card { flex:1; }
/* ── Settings home ─────────────────────── */
.settings-hero { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:24px; margin-bottom:16px; border:1px solid #EED7CC; border-radius:16px; background:linear-gradient(135deg,#FFF8F4 0%,#FDF2EE 58%,#F1F7F0 100%); box-shadow:var(--shadow); }
.settings-hero::after { content:""; position:absolute; width:150px; height:150px; right:-55px; top:-75px; border-radius:50%; background:rgba(232,160,191,.12); pointer-events:none; }
.settings-hero-main { display:flex; align-items:center; gap:16px; min-width:0; position:relative; z-index:1; }
.settings-hero-mark { width:56px; height:56px; flex:0 0 56px; display:grid; place-items:center; border-radius:18px; background:rgba(255,255,255,.82); border:1px solid rgba(212,120,92,.18); font-size:30px; box-shadow:0 6px 18px rgba(180,96,74,.10); }
.settings-hero-title { font-size:20px; font-weight:700; color:var(--text-heading); }
.settings-hero-copy { margin-top:4px; color:var(--text-soft); font-size:13px; line-height:1.5; }
.settings-hero-actions { flex:0 0 auto; position:relative; z-index:1; }
.setup-progress { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
.setup-progress-item { display:flex; align-items:center; gap:5px; padding:5px 9px; border-radius:14px; background:rgba(255,255,255,.62); color:var(--text-soft); font-size:12px; }
.setup-progress-item.complete { color:var(--success); }
.settings-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
.settings-grid > .card { margin-bottom:0; }
.settings-section-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.settings-section-title { font-size:16px; font-weight:700; color:var(--text-heading); }
.settings-section-copy { margin-top:3px; font-size:12px; color:var(--text-soft); }
.settings-tier { padding:10px 0; border-bottom:1px solid var(--border); }
.settings-tier:last-child { border-bottom:0; padding-bottom:0; }
.settings-tier-label { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:7px; }
.settings-tier-copy { font-size:11px; color:var(--text-soft); }
.settings-model-value { padding:9px 12px; border-radius:8px; background:var(--bg); color:var(--text-heading); font-size:13px; font-weight:600; }
.settings-model-value.empty { color:var(--warning); font-weight:500; }
/* ── Buttons ──────────────────────────── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; transition:all .15s; }
.btn-primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn-primary:hover { background:var(--primary-hover); }
.btn-ghost { background:transparent; color:var(--primary); border-color:var(--border); }
.btn-ghost:hover { background:var(--primary-bg); border-color:var(--primary); }
.btn-danger { background:var(--danger); color:#fff; }
.btn-danger:hover { opacity:.85; }
.btn-sm { padding:5px 12px; font-size:12px; }
/* ── Badges ───────────────────────────── */
.badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
.badge-ok { background:#e8f5e9; color:#2e7d32; }
.badge-warn { background:#fff3e0; color:#e65100; }
.badge-err { background:#ffebee; color:#c62828; }
.badge-info { background:var(--primary-bg); color:var(--primary); }
.badge-gray { background:#f0ebe5; color:#7a7573; }
/* ── Toggle ───────────────────────────── */
.toggle { position:relative; width:42px; height:24px; display:inline-block; }
.toggle input { opacity:0; width:0; height:0; }
.toggle .slider { position:absolute; inset:0; background:#ccc; border-radius:24px; cursor:pointer; transition:.2s; }
.toggle .slider::before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:.2s; }
.toggle input:checked + .slider { background:var(--success); }
.toggle input:checked + .slider::before { transform:translateX(18px); }
/* ── Inputs ───────────────────────────── */
.form-group { margin-bottom:12px; }
.form-label { display:block; font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
.form-input { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; color:var(--text); background:var(--card); transition:border .15s; }
.form-input:focus { outline:none; border-color:var(--primary); }
select.form-input { cursor:pointer; }
/* ── Table ────────────────────────────── */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; padding:8px 10px; border-bottom:2px solid var(--border); font-size:11px; text-transform:uppercase; color:var(--text-soft); }
.tbl td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:none; }
/* ── Toast ────────────────────────────── */
.toast { position:fixed; bottom:24px; right:24px; background:var(--text-heading); color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; transform:translateY(10px); transition:all .3s; pointer-events:none; z-index:999; }
.toast.show { opacity:1; transform:translateY(0); }
/* ── Modal ────────────────────────────── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
.modal-overlay.open { opacity:1; pointer-events:auto; }
.modal { background:var(--card); border-radius:var(--radius); padding:24px; width:520px; max-height:85vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.15); }
.modal h3 { margin-bottom:16px; color:var(--text-heading); }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
/* ── Status check ─────────────────────── */
.check-row { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; }
.check-icon { font-size:16px; width:20px; text-align:center; }
/* ── Transport selector cards ────────── */
.tp-cfg-btns { display:flex; gap:8px; margin:8px 0 4px; }
.tp-cfg-btn { padding:6px 14px; border:1px solid var(--border); border-radius:20px; font-size:13px; font-weight:500; cursor:pointer; background:var(--bg); color:var(--text); transition:all .15s; }
.tp-cfg-btn:hover { border-color:var(--primary); color:var(--primary); }
.tp-cfg-btn.active { border-color:var(--primary); background:var(--primary-bg); color:var(--primary); }
/* ── Stat cards ───────────────────────── */
.stat-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-align:center; }
.stat-number { font-size:28px; font-weight:700; color:var(--primary); }
.stat-label { font-size:12px; color:var(--text-soft); margin-top:4px; }
/* ── Loading ──────────────────────────── */
.loading { text-align:center; padding:40px; color:var(--text-soft); }
.spinner { display:inline-block; width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
/* ── Bot log panel ───────────────────── */
.bot-log { max-height:260px; overflow-y:auto; background:#1e1e1e; color:#d4d4d4; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-size:12px; line-height:1.5; padding:10px 12px; border-radius:8px; margin-top:10px; white-space:pre-wrap; word-break:break-all; }
.bot-log::-webkit-scrollbar { width:6px; }
.bot-log::-webkit-scrollbar-thumb { background:#555; border-radius:3px; }
/* ── Mobile ───────────────────────────── */
.mobile-toggle { display:none; position:fixed; top:12px; left:12px; z-index:20; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:18px; }
.sidebar-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:9; }
@media (max-width:768px) {
  .mobile-toggle { display:block; }
  .sidebar { left:-240px; transition:left .2s; }
  .sidebar.open { left:0; }
  .sidebar-backdrop.open { display:block; }
  .content { margin-left:0; padding:60px 16px 24px; }
  /* Modal: fit mobile screens */
  .modal { width:calc(100vw - 32px); max-width:520px; padding:16px; }
  /* Cards: stack vertically */
  .card-row { flex-direction:column; }
  .card { overflow-x:auto; }
  .settings-grid { grid-template-columns:1fr; }
  .settings-hero { align-items:flex-start; flex-direction:column; padding:20px; }
  .settings-hero-actions { width:100%; }
  .settings-hero-actions .btn { width:100%; justify-content:center; }
  /* Stat grid: 2 columns */
  .stat-grid { grid-template-columns:1fr 1fr; }
  /* Touch targets */
  .btn-sm { padding:8px 14px; font-size:13px; }
  /* Tables: smaller font */
  .tbl { font-size:12px; }
  /* Page title */
  .page-title { font-size:18px; }
  /* Config form rows: stack label + input vertically */
  .config-form-row { flex-direction:column !important; align-items:stretch !important; gap:6px !important; }
  .config-form-row > div[style*="min-width"] { min-width:0 !important; width:100% !important; }
  .config-form-row .form-input { width:100% !important; min-width:0 !important; }
  .config-form-row input[style*="width:100px"] { width:100% !important; }
  .config-form-row input[style*="width:260px"] { width:100% !important; }
}
</style>
</head>
<body>
<button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">🍡</span>
    <h1>MochiBot</h1>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <button class="nav-item active" data-page="settings"><span class="nav-icon">🏠</span> 设置</button>
    <button class="nav-item" data-page="memory"><span class="nav-icon">🧠</span> 记忆</button>
    <button class="nav-item" data-page="advanced"><span class="nav-icon">🛠️</span> 高级</button>
    <button class="nav-item" data-page="system"><span class="nav-icon">⚙️</span> 系统</button>
  </nav>
  <div style="padding:8px 12px; border-top:1px solid var(--border);">
    <button onclick="restartAdminServer()" style="display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-dim);border:none;background:none;width:100%;text-align:left;transition:background .15s;" onmouseover="this.style.background='var(--primary-bg)'" onmouseout="this.style.background='none'" id="admin-restart-btn">🔄 重启 Agent</button>
  </div>
</aside>

<main class="content">
<!-- ═══════ Settings ═══════ -->
<section id="page-settings" class="page active">
  <h2 class="page-title">设置</h2>
  <div id="settings-content"><div class="loading"><div class="spinner"></div> 加载中...</div></div>
</section>

<!-- ═══════ Memory ═══════ -->
<section id="page-memory" class="page">
  <h2 class="page-title">记忆</h2>

  <!-- Core -->
  <div class="card" style="margin-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:0">Core</div>
      <span class="badge badge-info" id="memory-token-badge">-</span>
    </div>
    <div id="memory-content">
      <div class="loading"><div class="spinner"></div> 加载中...</div>
    </div>
  </div>

  <!-- Memory Items -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="card-title" style="margin-bottom:0">记忆条目</div>
      <button class="btn btn-ghost btn-sm" onclick="searchMemoryItems(1)">↻ 刷新</button>
    </div>
    <div id="memory-extraction-status" style="font-size:12px;color:var(--text-soft);margin-bottom:14px">
      正在读取自动整理状态…
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
      <input id="mi-q" type="text" placeholder="🔍 关键词搜索…"
        class="form-input" style="flex:1;min-width:180px;border-radius:20px;padding:8px 14px;font-size:13px"
        onkeydown="if(event.key==='Enter')searchMemoryItems(1)" />
      <select id="mi-sort" class="form-input"
        style="width:auto;border-radius:20px;padding:8px 14px;font-size:13px"
        onchange="searchMemoryItems(1)">
        <option value="importance">按重要性</option>
        <option value="updated">按整理时间</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="searchMemoryItems(1)">搜索</button>
    </div>
    <div id="l2memory-content">
      <div class="loading"><div class="spinner"></div> 加载中...</div>
    </div>
  </div>

  <div style="margin-top:24px">
    <h3 style="font-size:17px;color:var(--text-heading);margin-bottom:12px">📦 搬家</h3>
    <div id="migration-content">
      <div class="loading"><div class="spinner"></div> 加载中...</div>
    </div>
  </div>
</section>

<!-- ═══════ Advanced ═══════ -->
<section id="page-advanced" class="page">
  <h2 class="page-title">高级设置</h2>
  <div id="advanced-content"><div class="loading"><div class="spinner"></div> 加载中...</div></div>
</section>

<!-- ═══════ System ═══════ -->
<section id="page-system" class="page">
  <h2 class="page-title">系统</h2>
  <div id="system-content"><div class="loading"><div class="spinner"></div> 加载中...</div></div>
</section>

</main>

<!-- Modal -->
<div class="modal-overlay" id="model-modal">
  <div class="modal">
    <h3 id="model-modal-title">添加模型</h3>
    <div class="form-group"><label class="form-label">名称</label><input class="form-input" id="mm-name" placeholder="例如 my-gpt4o"></div>
    <div class="form-group"><label class="form-label">服务商</label>
      <select class="form-input" id="mm-vendor" onchange="onVendorChange()"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option><option value="compatible">OpenAI-compatible</option></select>
    </div>
    <div class="form-group"><label class="form-label">模型</label><input class="form-input" id="mm-model" placeholder="例如 gpt-4o"></div>
    <div class="form-group" id="mm-credential-mode-group"><label class="form-label">凭据方式</label>
      <select class="form-input" id="mm-credential-mode" onchange="onCredentialModeChange()">
        <option value="new">填写新 API Key</option>
        <option value="existing" id="mm-existing-mode">复制已有模型凭据</option>
      </select>
    </div>
    <div class="form-group" id="mm-apikey-group"><label class="form-label">API Key</label><input class="form-input" id="mm-apikey" type="password" autocomplete="new-password" placeholder="sk-..."></div>
    <div class="form-group" id="mm-credential-source-group" style="display:none"><label class="form-label">来源模型</label>
      <select class="form-input" id="mm-credential-source"></select>
      <div style="font-size:11px;color:var(--text-soft);margin-top:4px">复制 API Key 和 Base URL；保存后与来源模型互不联动。</div>
    </div>
    <div class="form-group" id="mm-baseurl-group"><label class="form-label">Base URL（可选）</label><input class="form-input" id="mm-baseurl" placeholder="https://..."><div id="mm-baseurl-help" style="display:none;font-size:11px;color:var(--text-soft);margin-top:4px"></div></div>
    <div id="mm-test-result" style="font-size:13px;margin-top:8px"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModelModal()">取消</button>
      <button class="btn btn-ghost" onclick="testModelInModal()">🔌 测试</button>
      <button class="btn btn-primary" onclick="saveModelFromModal()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Memory Item Edit Modal -->
<div class="modal-overlay" id="mi-modal" onclick="if(event.target===this)closeMiModal()">
  <div class="modal">
    <h3 id="mi-modal-title">编辑记忆</h3>
    <input type="hidden" id="mi-edit-id" />
    <div class="form-group"><label class="form-label">内容</label>
      <textarea class="form-input" id="mi-edit-content" style="min-height:120px;resize:vertical;font-family:inherit"></textarea>
    </div>
    <div class="form-group"><label class="form-label">重要性</label>
      <select class="form-input" id="mi-edit-importance">
        <option value="1">★ 日常</option>
        <option value="2">★★ 重要</option>
        <option value="3">★★★ 关键</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeMiModal()">取消</button>
      <button class="btn btn-primary" onclick="saveMiEdit()">💾 保存</button>
    </div>
  </div>
</div>

<script>
// Persist token across page refreshes via sessionStorage (cleared when tab closes)
const _urlToken = new URLSearchParams(location.search).get('token') || '';
if (_urlToken) {
  sessionStorage.setItem('_admin_token', _urlToken);
  // Remove token from URL to prevent exposure in browser history / Referer headers
  const cleanUrl = new URL(location);
  cleanUrl.searchParams.delete('token');
  window.history.replaceState({}, '', cleanUrl);
}
const authToken = _urlToken || sessionStorage.getItem('_admin_token') || '';
let _telegramBotInfo = null; // {username, first_name} — set after successful token test
let _weixinConnected = false; // set after successful WeChat token test
let _openTransportCfg = null; // 'telegram' | 'weixin' | null — which config panel is open
let _wxQrPollTimer = null;   // QR scan poll interval
let _wxQrRefreshCount = 0;   // QR refresh counter (max 6)
let _wxQrStartTime = 0;      // overall timeout tracking
let _wxQrActiveContent = '';  // current QR URL for re-render after DOM rebuild
let _wxQrStatusHtml = '';     // current status HTML for re-render after DOM rebuild
let _wxQrGeneration = 0;       // invalidates cancelled/replaced QR polling sessions

async function api(method, path, body) {
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  if (!r.ok) {
    let msg = r.status + ': 未知错误';
    try { const j = await r.json(); msg = j.detail || j.error || JSON.stringify(j); }
    catch { try { msg = await r.text() || msg; } catch {} }
    const err = new Error(msg); err.status = r.status; throw err;
  }
  return r.json();
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),4000); }
function statusIcon(type) {
  const m = { ok:['var(--success)','✓'], err:['#d32f2f','✗'], warn:['var(--warning)','!'], off:['var(--border)',''] };
  const [bg,ch] = m[type] || m.off;
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:${bg};color:#fff;font-size:12px;flex-shrink:0">${ch}</span>`;
}

// ── Navigation ───────────────────────────
const loaded = {};
let _settingsRequestGeneration = 0;
let _systemRequestGeneration = 0;
let _freeTimeMax = 64;
const loaders = { settings:loadSettings, memory:loadMemory, advanced:loadAdvanced, system:loadSystem };

document.getElementById('sidebar-nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  const page = item.dataset.page;
  stopSettingsPolling();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  item.classList.add('active');
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'settings') { loaded.settings = false; loadSettings(); }
  else if (page === 'system') { loaded.system = true; loadSystem(); }
  else if (!loaded[page]) { loaded[page] = true; loaders[page]?.(); }
  // mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('open');
}

// Auto-load settings
loaded.settings = true;
loadSettings();

function showTransportConfig(type) {
  // Toggle: if already open, close it; otherwise open the selected one
  _openTransportCfg = (_openTransportCfg === type) ? null : type;
  const tgCfg = document.getElementById('transport-cfg');
  const wxCfg = document.getElementById('weixin-cfg');
  const tgBtn = document.getElementById('tp-btn-telegram');
  const wxBtn = document.getElementById('tp-btn-weixin');
  if (tgCfg) tgCfg.style.display = _openTransportCfg === 'telegram' ? 'block' : 'none';
  if (wxCfg) wxCfg.style.display = _openTransportCfg === 'weixin' ? 'block' : 'none';
  if (tgBtn) tgBtn.className = 'tp-cfg-btn' + (_openTransportCfg === 'telegram' ? ' active' : '');
  if (wxBtn) wxBtn.className = 'tp-cfg-btn' + (_openTransportCfg === 'weixin' ? ' active' : '');
}

async function unbindTransport(platform) {
  if (!platform) return;
  if (!confirm('确定要解绑 ' + platform + ' 吗？Bot 将停止运行。')) return;
  try {
    if (platform === 'Telegram') {
      await api('PUT', '/env', {'TELEGRAM_BOT_TOKEN': ''});
      _telegramBotInfo = null;
    } else {
      await api('PUT', '/env', {'WEIXIN_ENABLED': 'false', 'WEIXIN_BOT_TOKEN': ''});
      _weixinConnected = false;
    }
    showToast('已解绑 ' + platform);
    await api('POST', '/bot/stop').catch(() => {});
    showToast('🔄 Agent 正在重启并应用解绑配置...');
    waitForServerBack(true);
  } catch(e) { showToast('操作失败: ' + e.message); }
}

async function saveTransportConfig() {
  const tokenInput = document.getElementById('cfg-TELEGRAM_BOT_TOKEN');
  if (!tokenInput || !tokenInput.value.trim()) return showToast('Bot Token 不能为空');
  // Confirm if switching from WeChat
  if (_weixinConnected && !confirm('这将断开 WeChat 连接，确定切换到 Telegram？')) return;
  const token = tokenInput.value.trim();
  const statusEl = document.getElementById('tg-connect-status');
  const saveBtn = document.getElementById('tg-save-btn');

  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中...'; }
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-soft)">⏳ 保存并验证中...</span>';

  try {
    // Step 1: Save to .env
    const r = await api('PUT', '/env', {'TELEGRAM_BOT_TOKEN': token});
    if (r.errors && r.errors.length) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ 保存失败: ' + r.errors.map(e=>esc(e.key)).join(', ') + '</span>';
      return;
    }

    // Step 2: Test connection
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-soft)">⏳ 验证 Token...</span>';
    const test = await api('POST', '/telegram/test', {token});

    if (test.ok) {
      _telegramBotInfo = {username: test.username, first_name: test.first_name};
      // Clear WeChat credentials (mutually exclusive transports)
      _weixinConnected = false;
      api('PUT', '/env', {'WEIXIN_ENABLED': 'false', 'WEIXIN_BOT_TOKEN': ''}).catch(() => {});
      if (statusEl) {
        statusEl.innerHTML = '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
          + '<span class="badge badge-ok" style="font-size:13px">✅ 已连接</span>'
          + '<strong>@' + esc(test.username) + '</strong>'
          + '<span style="color:var(--text-soft);font-size:12px">(' + esc(test.first_name) + ')</span>'
          + '</div>';
      }
      showToast('✅ Telegram 已连接，请继续完成设置');
      loaded.settings = false;
      loadSettings();
    } else {
      _telegramBotInfo = null;
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ Token 无效: ' + esc(test.error) + '</span>';
    }
  } catch(e) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ 错误: ' + esc(e.message) + '</span>';
  } finally {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '保存并连接'; }
  }
}

async function startBotAndRefresh() {
  // Disable all restart buttons and show loading state
  document.querySelectorAll('[data-restart-btn]').forEach(b => {
    b.disabled = true; b.textContent = 'Agent 重启中...';
  });
  try {
    await api('POST', '/bot/start');
    showToast('🔄 Agent 重启中，正在等待服务恢复...');
  } catch(e) {
    showToast('❌ Agent 重启失败: ' + e.message);
    document.querySelectorAll('[data-restart-btn]').forEach(b => {
      b.disabled = false; b.textContent = '重启 Agent';
    });
    return;
  }
  waitForServerBack(true);
}

async function stopAgentAndRefresh() {
  if (!confirm('确定要关闭 Agent 吗？管理后台会继续运行。')) return;
  document.querySelectorAll('[data-agent-stop-btn]').forEach(b => {
    b.disabled = true;
    b.textContent = '关闭中...';
  });
  try {
    await api('POST', '/bot/stop');
    showToast('Agent 正在关闭...');
  } catch(e) {
    showToast('❌ Agent 关闭失败: ' + e.message);
    document.querySelectorAll('[data-agent-stop-btn]').forEach(b => {
      b.disabled = false;
      b.textContent = '关闭 Agent';
    });
    return;
  }
  waitForServerBack(true);
}

async function restartAdminServer() {
  if (!confirm('确定要重启 Agent 吗？页面会短暂断开连接。')) return;
  const btn = document.getElementById('admin-restart-btn');
  if (btn) { btn.disabled = true; btn.textContent = '重启中...'; }
  try {
    await api('POST', '/admin/restart');
  } catch(e) {
    // Server may have already died — that's expected
  }
  showToast('🔄 Agent 重启中，等待重新连接...');
  waitForServerBack(true);
}

async function exportDiagnostics() {
  const btn = event?.target;
  if (btn) { btn.disabled = true; btn.textContent = '导出中...'; }
  try {
    const opts = {method:'GET', headers:{}};
    if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
    const r = await fetch('/api/diagnostics/export', opts);
    if (!r.ok) throw new Error(r.status + ': ' + await r.text());
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mochibot-diagnostics-' + new Date().toISOString().replace(/[T:]/g, '-').slice(0, 19) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ 诊断报告已下载');
  } catch(e) {
    showToast('❌ 导出失败: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📋 导出诊断报告'; }
  }
}

async function checkSystemUpdate(btn) {
  const orig = btn.textContent;
  btn.textContent = '检查中...';
  btn.disabled = true;
  const container = document.getElementById('update-status');
  container.innerHTML = '';
  let countdown = false;
  try {
    const r = await api('POST', '/system/update-check');
    if (!r.ok) {
      container.innerHTML = `<div style="font-size:12px;color:var(--danger)">${esc(r.error)}</div>`;
      return;
    }
    if (!r.available) {
      container.innerHTML = `<div style="font-size:12px;color:var(--success);display:flex;align-items:center;gap:6px">${statusIcon('ok')} 已是最新版本 (${esc(r.current_hash)})</div>`;
      showToast('已是最新版本');
      return;
    }
    let h = `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:8px">`;
    h += `<div style="font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px">`;
    h += `${statusIcon('warn')} 有新版本可用`;
    h += `<span class="badge badge-info">v${esc(r.current_version)}</span>`;
    h += `<span style="color:var(--text-soft)">→</span>`;
    h += `<span class="badge badge-ok">v${esc(r.remote_version)}</span>`;
    h += `<span style="font-size:11px;color:var(--text-soft)">(${r.commits_behind} 个提交)</span>`;
    h += `</div>`;
    if (r.changelog_diff) {
      h += `<details style="margin-bottom:10px"><summary style="cursor:pointer;font-size:12px;color:var(--text-soft)">查看更新日志</summary>`;
      h += `<div class="bot-log" style="max-height:180px;overflow:auto;margin-top:6px;font-size:11px;white-space:pre-wrap">${esc(r.changelog_diff)}</div>`;
      h += `</details>`;
    }
    h += `<button class="btn btn-primary btn-sm" onclick="applySystemUpdate(this)">更新并重启</button>`;
    h += `</div>`;
    container.innerHTML = h;
  } catch(e) {
    if (e.status === 429) {
      let sec = 60;
      const m = e.message.match(/(\d+)\s*秒/);
      if (m) sec = parseInt(m[1]);
      countdown = true;
      container.innerHTML = '';
      const tick = () => {
        if (sec <= 0) { checkSystemUpdate(btn); return; }
        btn.textContent = `请稍候 (${sec}s)`;
        sec--;
        setTimeout(tick, 1000);
      };
      tick();
      return;
    }
    container.innerHTML = `<div style="font-size:12px;color:var(--danger)">检查失败：${esc(e.message)}</div>`;
  } finally {
    if (!countdown) { btn.textContent = orig; btn.disabled = false; }
  }
}

async function applySystemUpdate(btn) {
  btn.disabled = true;
  let dots = 0;
  btn.textContent = '更新中...';
  const anim = setInterval(() => { dots = (dots + 1) % 3; btn.textContent = '更新中' + '.'.repeat(dots + 1); }, 400);
  const container = document.getElementById('update-status');
  try {
    const r = await api('POST', '/system/update-apply');
    if (!r.ok) {
      let msg = `<div style="font-size:12px;color:var(--danger);margin-top:8px">${esc(r.error)}</div>`;
      if (r.dirty_files) {
        msg += `<div class="bot-log" style="max-height:120px;overflow:auto;margin-top:6px;font-size:11px;white-space:pre-wrap">${esc(r.dirty_files)}</div>`;
      }
      if (r.hint) {
        msg += `<div style="font-size:11px;color:var(--text-soft);margin-top:6px">${esc(r.hint)}</div>`;
      }
      container.innerHTML = msg;
      showToast('更新失败');
      return;
    }
    let h = `<div style="font-size:13px;color:var(--success);display:flex;align-items:center;gap:6px;margin-top:8px">${statusIcon('ok')} ${esc(r.message)}</div>`;
    h += `<div style="font-size:11px;color:var(--text-soft);margin-top:4px">新版本：v${esc(r.new_version)}</div>`;
    if (r.restarting) {
      h += `<div id="restart-countdown" style="margin-top:10px;font-size:12px;color:var(--text-soft)">3 秒后自动重启…</div>`;
      container.innerHTML = h;
      showToast('✅ 更新完成，正在重启');
      let n = 3;
      const tick = setInterval(() => {
        n -= 1;
        const el = document.getElementById('restart-countdown');
        if (el) el.textContent = n > 0 ? `${n} 秒后自动重启…` : '正在重启，页面将自动刷新…';
        if (n <= 0) {
          clearInterval(tick);
          // Wait for the server to actually exit, then poll until it's back.
          setTimeout(() => waitForServerBack(true), 1500);
        }
      }, 1000);
    } else {
      h += `<div style="margin-top:10px;display:flex;gap:8px">`;
      h += `<button class="btn btn-primary btn-sm" onclick="restartAfterUpdate()">重启 Bot + Admin</button>`;
      h += `</div>`;
      container.innerHTML = h;
      showToast('✅ 更新完成，请重启生效');
    }
  } catch(e) {
    container.innerHTML = `<div style="font-size:12px;color:var(--danger);margin-top:8px">更新失败：${esc(e.message)}</div>`;
    showToast('更新失败');
  } finally {
    clearInterval(anim);
    btn.disabled = false;
  }
}

async function waitForServerBack(waitForShutdown) {
  let sawServerDown = !waitForShutdown;
  const statusOptions = { cache: 'no-store' };
  if (authToken) statusOptions.headers = {'Authorization': 'Bearer ' + authToken};
  for (let i = 0; i < 30; i++) {
    try {
      const r = await fetch('/api/status', statusOptions);
      if (r.ok) {
        if (sawServerDown) { location.reload(); return; }
      } else {
        sawServerDown = true;
      }
    } catch (_) { sawServerDown = true; }
    await new Promise(res => setTimeout(res, 1000));
  }
  // Give up gracefully — user can refresh manually.
  const el = document.getElementById('restart-countdown');
  if (el) el.textContent = '重启耗时较长，请手动刷新页面。';
}

async function restartAfterUpdate() {
  try {
    await api('POST', '/admin/restart');
    showToast('正在重启...');
    document.getElementById('update-status').innerHTML = '<div style="font-size:12px;color:var(--text-soft);margin-top:8px">正在重启，页面将在几秒后自动刷新...</div>';
    waitForServerBack(true);
  } catch(e) {
    showToast('重启请求已发送，请手动刷新页面');
    waitForServerBack(true);
  }
}

// ── WeChat QR Scan Flow ──────────

async function startWeixinQR() {
  const statusEl = document.getElementById('wx-qr-status');
  const canvasEl = document.getElementById('wx-qr-canvas');
  const btnEl = document.getElementById('wx-qr-btn');
  const cancelEl = document.getElementById('wx-qr-cancel');
  const generation = cancelWeixinQR();

  if (btnEl) { btnEl.disabled = true; btnEl.textContent = '获取二维码中...'; }
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-soft)">⏳ 正在获取二维码...</span>';
  if (canvasEl) { canvasEl.style.display = 'none'; canvasEl.getContext('2d').clearRect(0,0,canvasEl.width,canvasEl.height); }

  try {
    const r = await api('POST', '/weixin/qr');
    if (generation !== _wxQrGeneration) return;
    if (!r.ok) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ ' + esc(r.error) + '</span>';
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = '扫码登录'; }
      return;
    }
    // Render QR code to canvas
    if (canvasEl) {
      renderQRToCanvas(canvasEl, r.qrcode_img_content, 220);
      canvasEl.style.display = 'block';
    }
    _wxQrActiveContent = r.qrcode_img_content;
    _wxQrStatusHtml = '<span style="color:var(--text-soft)">📱 用微信扫描上方二维码</span>';
    if (statusEl) statusEl.innerHTML = _wxQrStatusHtml;
    if (btnEl) btnEl.style.display = 'none';
    if (cancelEl) cancelEl.style.display = 'inline-block';

    // Start polling
    _wxQrRefreshCount = 0;
    _wxQrStartTime = Date.now();
    pollWeixinQR(r.qrcode, generation);
  } catch(e) {
    if (generation !== _wxQrGeneration) return;
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ ' + esc(e.message) + '</span>';
    if (btnEl) { btnEl.disabled = false; btnEl.textContent = '扫码登录'; }
  }
}

function pollWeixinQR(qrcode, generation) {
  if (generation !== _wxQrGeneration) return;
  if (_wxQrPollTimer) clearInterval(_wxQrPollTimer);
  const QR_TIMEOUT_MS = 480000; // 8 min
  const QR_MAX_REFRESH = 6;
  const POLL_INTERVAL_MS = 3000;

  _wxQrPollTimer = setInterval(async () => {
    if (generation !== _wxQrGeneration) return;
    // Overall timeout
    if (Date.now() - _wxQrStartTime > QR_TIMEOUT_MS) {
      cancelWeixinQR();
      const s = document.getElementById('wx-qr-status');
      if (s) s.innerHTML = '<span style="color:var(--danger)">⏰ 扫码超时，请重试</span>';
      resetWxQrBtn();
      return;
    }
    try {
      const r = await api('POST', '/weixin/qr/poll', {qrcode});
      if (generation !== _wxQrGeneration) return;

      if (r.status === 'scaned') {
        const s = document.getElementById('wx-qr-status');
        _wxQrStatusHtml = '<span style="color:var(--primary)">✅ 已扫码，请在手机上确认...</span>';
        if (s) s.innerHTML = _wxQrStatusHtml;
      } else if (r.status === 'expired') {
        _wxQrRefreshCount++;
        if (_wxQrRefreshCount > QR_MAX_REFRESH) {
          cancelWeixinQR();
          const s = document.getElementById('wx-qr-status');
          if (s) s.innerHTML = '<span style="color:var(--danger)">⏰ 二维码已过期多次，请重试</span>';
          resetWxQrBtn();
          return;
        }
        // Fetch new QR
        const nextGeneration = cancelWeixinQR();
        const s = document.getElementById('wx-qr-status');
        if (s) s.innerHTML = '<span style="color:var(--text-soft)">🔄 二维码已过期，自动刷新中...</span>';
        let fresh;
        try {
          fresh = await api('POST', '/weixin/qr');
        } catch(e) { /* restart polling with the old ID */ }
        if (nextGeneration !== _wxQrGeneration) return;
        if (fresh && fresh.ok) {
          const c = document.getElementById('wx-qr-canvas');
          if (c) renderQRToCanvas(c, fresh.qrcode_img_content, 220);
          _wxQrActiveContent = fresh.qrcode_img_content;
          _wxQrStatusHtml = '<span style="color:var(--text-soft)">📱 用微信扫描上方二维码</span>';
          if (s) s.innerHTML = _wxQrStatusHtml;
          // Restart poll with the new QR's generation.
          pollWeixinQR(fresh.qrcode, nextGeneration);
          return;
        }
        pollWeixinQR(qrcode, nextGeneration);
        return;
      } else if (r.status === 'confirmed') {
        cancelWeixinQR();
        _wxQrActiveContent = '';
        _wxQrStatusHtml = '';
        _weixinConnected = true;
        _telegramBotInfo = null; // mutually exclusive
        const s = document.getElementById('wx-qr-status');
        if (s) s.innerHTML = '<span class="badge badge-ok" style="font-size:13px">✅ 登录成功！Token 已自动保存</span>';
        const c = document.getElementById('wx-qr-canvas');
        if (c) c.style.display = 'none';
        const cancel = document.getElementById('wx-qr-cancel');
        if (cancel) cancel.style.display = 'none';
        showToast('✅ WeChat 已连接，请继续完成设置');
        loaded.settings = false;
        loadSettings();
        return;
      } else if (r.status === 'error') {
        cancelWeixinQR();
        const s = document.getElementById('wx-qr-status');
        if (s) s.innerHTML = '<span style="color:var(--danger)">❌ ' + esc(r.error) + '</span>';
        resetWxQrBtn();
        return;
      }
      // status === 'wait' → continue polling
    } catch(e) {
      // Transient error — keep polling
    }
  }, POLL_INTERVAL_MS);
}

function cancelWeixinQR() {
  if (_wxQrPollTimer) { clearInterval(_wxQrPollTimer); _wxQrPollTimer = null; }
  _wxQrGeneration++;
  return _wxQrGeneration;
}

function resetWxQrBtn() {
  const btn = document.getElementById('wx-qr-btn');
  const cancel = document.getElementById('wx-qr-cancel');
  if (btn) { btn.disabled = false; btn.textContent = '扫码登录'; btn.style.display = 'inline-block'; }
  if (cancel) cancel.style.display = 'none';
}

function stopWeixinQR() {
  cancelWeixinQR();
  _wxQrActiveContent = '';
  _wxQrStatusHtml = '';
  const c = document.getElementById('wx-qr-canvas');
  if (c) c.style.display = 'none';
  const s = document.getElementById('wx-qr-status');
  if (s) s.innerHTML = '';
  resetWxQrBtn();
}

function toggleWxManualInput() {
  const el = document.getElementById('wx-manual-input');
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ── QR Code Generator (Nayuki qrcodegen, MIT License) ──
// Project Nayuki — https://www.nayuki.io/page/qr-code-generator-library
// Compiled from TypeScript source. Supports QR versions 1-40, all 4 EC levels.
var qrcodegen;
(function (qrcodegen) {
    class QrCode {
        static encodeText(text, ecl) {
            const segs = qrcodegen.QrSegment.makeSegments(text);
            return QrCode.encodeSegments(segs, ecl);
        }
        static encodeBinary(data, ecl) {
            const seg = qrcodegen.QrSegment.makeBytes(data);
            return QrCode.encodeSegments([seg], ecl);
        }
        static encodeSegments(segs, ecl, minVersion = 1, maxVersion = 40, mask = -1, boostEcl = true) {
            if (!(QrCode.MIN_VERSION <= minVersion && minVersion <= maxVersion && maxVersion <= QrCode.MAX_VERSION)
                || mask < -1 || mask > 7)
                throw new RangeError("Invalid value");
            let version;
            let dataUsedBits;
            for (version = minVersion;; version++) {
                const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
                const usedBits = QrSegment.getTotalBits(segs, version);
                if (usedBits <= dataCapacityBits) {
                    dataUsedBits = usedBits;
                    break;
                }
                if (version >= maxVersion)
                    throw new RangeError("Data too long");
            }
            for (const newEcl of [QrCode.Ecc.MEDIUM, QrCode.Ecc.QUARTILE, QrCode.Ecc.HIGH]) {
                if (boostEcl && dataUsedBits <= QrCode.getNumDataCodewords(version, newEcl) * 8)
                    ecl = newEcl;
            }
            let bb = [];
            for (const seg of segs) {
                appendBits(seg.mode.modeBits, 4, bb);
                appendBits(seg.numChars, seg.mode.numCharCountBits(version), bb);
                for (const b of seg.getData())
                    bb.push(b);
            }
            assert(bb.length == dataUsedBits);
            const dataCapacityBits = QrCode.getNumDataCodewords(version, ecl) * 8;
            assert(bb.length <= dataCapacityBits);
            appendBits(0, Math.min(4, dataCapacityBits - bb.length), bb);
            appendBits(0, (8 - bb.length % 8) % 8, bb);
            assert(bb.length % 8 == 0);
            for (let padByte = 0xEC; bb.length < dataCapacityBits; padByte ^= 0xEC ^ 0x11)

function renderQRToCanvas(canvas, text, size) {
  const ctx = canvas.getContext('2d');
  try {
    const qr = qrcodegen.QrCode.encodeText(text, qrcodegen.QrCode.Ecc.LOW);
    const moduleCount = qr.size;
    const minCellPx = 4;
    const effectiveSize = Math.max(size, (moduleCount + 8) * minCellPx);
    canvas.width = effectiveSize;
    canvas.height = effectiveSize;
    canvas.style.maxWidth = size + 'px';
    canvas.style.height = 'auto';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, effectiveSize, effectiveSize);
    const cellSize = effectiveSize / (moduleCount + 8);
    const offset = (effectiveSize - cellSize * moduleCount) / 2;
    ctx.fillStyle = '#000000';
    for (let r = 0; r < moduleCount; r++) {
      for (let c = 0; c < moduleCount; c++) {
        if (qr.getModule(c, r)) {
          ctx.fillRect(
            Math.round(offset + c * cellSize),
            Math.round(offset + r * cellSize),
            Math.ceil(cellSize),
            Math.ceil(cellSize)
          );
        }
      }
    }
  } catch(e) {
    canvas.width = size;
    canvas.height = size;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#ff0000';
    ctx.font = '12px sans-serif';
    ctx.fillText('QR Error', 10, size/2);
  }

async function saveWeixinConfig() {
  const tokenInput = document.getElementById('cfg-WEIXIN_BOT_TOKEN');
  if (!tokenInput || !tokenInput.value.trim()) return showToast('Bot Token 不能为空');
  // Confirm if switching from Telegram
  if (_telegramBotInfo && !confirm('这将断开 Telegram 连接，确定切换到 WeChat？')) return;
  const token = tokenInput.value.trim();
  const allowedInput = document.getElementById('cfg-WEIXIN_ALLOWED_USERS');
  const allowed = allowedInput ? allowedInput.value.trim() : '';
  const statusEl = document.getElementById('wx-connect-status');
  const saveBtn = document.getElementById('wx-save-btn');

  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中...'; }
  if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-soft)">⏳ 保存并验证中...</span>';

  try {
    // Step 1: Save to .env
    const envData = {
      'WEIXIN_ENABLED': 'true',
      'WEIXIN_BOT_TOKEN': token,
    };
    if (allowed) envData['WEIXIN_ALLOWED_USERS'] = allowed;
    const r = await api('PUT', '/env', envData);
    if (r.errors && r.errors.length) {
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ 保存失败: ' + r.errors.map(e=>esc(e.key)).join(', ') + '</span>';
      return;
    }

    // Step 2: Test connection
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-soft)">⏳ 验证 Token...</span>';
    const test = await api('POST', '/weixin/test', {token});

    if (test.ok) {
      _weixinConnected = true;
      // Clear Telegram credentials (mutually exclusive transports)
      _telegramBotInfo = null;
      api('PUT', '/env', {'TELEGRAM_BOT_TOKEN': ''}).catch(() => {});
      if (statusEl) statusEl.innerHTML = '<span class="badge badge-ok" style="font-size:13px">✅ Token 有效</span>'
        + '<div style="margin-top:8px;color:var(--text-soft);font-size:13px">继续完成设置后手动启动 Agent。</div>';
      showToast('✅ WeChat 已连接，请继续完成设置');
      loaded.settings = false;
      loadSettings();
    } else {
      _weixinConnected = false;
      if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ Token 无效: ' + esc(test.error) + '</span>';
    }
  } catch(e) {
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--danger)">❌ 错误: ' + esc(e.message) + '</span>';
  } finally {
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '保存并连接'; }
  }
}

// ── Settings page bot-status polling ─────
let _settingsPollTimer = null;
let _settingsLastRunning = null;
let _settingsLastOwner = null;

function startSettingsPolling() {
  if (_settingsPollTimer) clearInterval(_settingsPollTimer);
  _settingsPollTimer = setInterval(async () => {
    if (!document.getElementById('page-settings').classList.contains('active')) return;
    try {
      const st = await api('GET', '/bot/status');
      const full = await api('GET', '/status');
      const ownerNow = full.config_status?.owner_user_id?.set || false;
      if (st.running !== _settingsLastRunning || ownerNow !== _settingsLastOwner) {
        _settingsLastRunning = st.running;
        _settingsLastOwner = ownerNow;
        if (document.getElementById('page-settings').classList.contains('active')) {
          loaded.settings = false;
          loadSettings();
        }
      }
    } catch(e) { /* ignore transient errors */ }
  }, 8000);
}
function stopSettingsPolling() {
  if (_settingsPollTimer) { clearInterval(_settingsPollTimer); _settingsPollTimer = null; }
  _settingsLastRunning = null;
  _settingsLastOwner = null;
}

function _fmtBytes(b) {
  if (b >= 1024*1024) return (b/1024/1024).toFixed(1)+' MB';
  return (b/1024).toFixed(1)+' KB';
}

function renderCheckupBody(c) {
  let h = '';

  // Core budget
  const ps = c.prompt_size;
  if (ps && !ps.error) {
    h += '<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px">Core 容量</div>';
    const cm = ps.core_memory || {};
    const cmBadge = cm.over_budget ? 'badge-warn' : 'badge-ok';
    h += `<div class="check-row">${cm.over_budget ? statusIcon('warn') : statusIcon('ok')}`
      + `<span>Core</span>`
      + `<span class="badge ${cmBadge}" style="margin-left:auto">${cm.tokens} / ${cm.max_tokens} tokens</span></div>`;
    h += '</div>';
  } else if (ps && ps.error) {
    h += `<div style="margin-bottom:12px;color:var(--danger)">Core 容量: ${esc(ps.error)}</div>`;
  }

  // Database
  const db = c.database;
  if (db && !db.error) {
    h += '<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px">数据库</div>';
    const intOk = db.integrity_ok;
    h += `<div class="check-row">${intOk ? statusIcon('ok') : statusIcon('err')}`
      + `<span>大小: ${_fmtBytes(db.file_size_bytes || 0)}</span>`
      + `<span class="badge ${intOk ? 'badge-ok' : 'badge-err'}" style="margin-left:auto">`
      + `完整性: ${intOk ? 'ok' : '异常'}</span></div>`;
    const tc = db.table_counts || {};
    const parts = Object.entries(tc).map(([t,n]) => `${t} ${n}`).join(' | ');
    h += `<div style="font-size:12px;color:var(--text-soft);margin-top:4px;padding-left:28px">${esc(parts)}</div>`;
    h += '</div>';
  } else if (db && db.error) {
    h += `<div style="margin-bottom:12px;color:var(--danger)">数据库: ${esc(db.error)}</div>`;
  }

  // Memory
  const mem = c.memory;
  if (mem && !mem.error) {
    h += '<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px">记忆系统</div>';
    h += `<div class="check-row">${statusIcon('ok')}<span>总记忆: ${mem.total} 条</span></div>`;
    h += `<div class="check-row">${statusIcon('ok')}<span>KG: ${mem.kg_entities} 实体, ${mem.kg_active_triples} 三元组</span></div>`;
    h += `<div class="check-row">${statusIcon('ok')}<span>回收站: ${mem.trash_count} 条</span></div>`;
    h += '</div>';
  } else if (mem && mem.error) {
    h += `<div style="margin-bottom:12px;color:var(--danger)">记忆系统: ${esc(mem.error)}</div>`;
  }

  // Runtime
  const rt = c.runtime;
  if (rt && !rt.error) {
    h += '<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px">运行状态</div>';
    const errN = rt.error_count_24h || 0;
    h += `<div class="check-row">${errN === 0 ? statusIcon('ok') : statusIcon('warn')}`
      + `<span>24h 错误: ${errN} 条</span></div>`;
    h += '</div>';
  } else if (rt && rt.error) {
    h += `<div style="margin-bottom:12px;color:var(--danger)">运行状态: ${esc(rt.error)}</div>`;
  }

  // Timestamp
  if (c.checked_at) {
    h += `<div style="font-size:11px;color:var(--text-soft);margin-top:4px">检查时间: ${esc(c.checked_at)}</div>`;
  }
  return h;
}

function renderCheckupCard(c) {
  let h = '<div class="card" id="checkup-card">';
  h += '<div class="card-title" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="toggleCheckup()">';
  h += '<span>系统体检 <span id="checkup-toggle-hint" style="font-size:11px;color:var(--text-soft);font-weight:400">▶ 点击展开</span></span>';
  h += '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();refreshCheckup()" style="font-size:12px;padding:2px 8px">刷新</button>';
  h += '</div>';
  h += '<div id="checkup-body" style="display:none">';
  h += renderCheckupBody(c);
  h += '</div></div>';
  return h;
}

function toggleCheckup() {
  const body = document.getElementById('checkup-body');
  const hint = document.getElementById('checkup-toggle-hint');
  if (!body) return;
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (hint) hint.textContent = hidden ? '▼' : '▶ 点击展开';
}

async function refreshCheckup() {
  const body = document.getElementById('checkup-body');
  if (!body) return;
  body.innerHTML = '<div style="color:var(--text-soft);font-size:13px">正在检查…</div>';
  try {
    const data = await api('GET', '/checkup');
    if (data && data.ok) {
      body.innerHTML = renderCheckupBody(data);
    } else {
      body.innerHTML = '<div style="color:var(--danger)">体检失败: ' + esc(data?.error || 'unknown') + '</div>';
    }
  } catch(e) {
    body.innerHTML = '<div style="color:var(--danger)">体检请求失败: ' + esc(e.message) + '</div>';
  }
}

function hourToClock(value, fallbackHour) {
  const hour = Number(value);
  const wrapped = Number.isFinite(hour)
    ? ((Math.trunc(hour) % 24) + 24) % 24
    : fallbackHour;
  return String(wrapped).padStart(2, '0') + ':00';
}

function clockValue(value, fallback) {
  const text = String(value == null ? '' : value).trim();
  const match = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(text);
  if (!match) return fallback;
  return String(Number(match[1])).padStart(2, '0') + ':' + match[2];
}

function clockToMinutes(value) {
  const match = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(String(value || ''));
  if (!match) return null;
  const hour = Number(match[1]);
  const minute = Number(match[2]);
  const second = Number(match[3] || 0);
  if (hour > 23 || minute > 59 || second > 59) return null;
  return hour * 60 + minute;
}

function windowCapacity(start, end) {
  const begin = clockToMinutes(start);
  const finishRaw = clockToMinutes(end);
  if (begin == null || finishRaw == null || begin === finishRaw) return 0;
  let finish = finishRaw;
  if (finish <= begin) finish += 24 * 60;
  const span = finish - begin;
  return Math.max(1, Math.floor(span / 15));
}

function clockHour(value) {
  const minutes = clockToMinutes(value);
  if (minutes == null) return null;
  if (minutes % 60 !== 0) return null;
  return Math.floor(minutes / 60) % 24;
}

function snapSleepHour(input) {
  if (!input) return;
  const minutes = clockToMinutes(input.value);
  if (minutes == null) return;
  const hour = Math.floor(minutes / 60) % 24;
  input.value = String(hour).padStart(2, '0') + ':00';
}

function syncFreeTimeCap() {
  const start = document.getElementById('pref-ft-start')?.value;
  const end = document.getElementById('pref-ft-end')?.value;
  const sleepStart = document.getElementById('pref-sleep-start')?.value;
  const sleepEnd = document.getElementById('pref-sleep-end')?.value;
  const cap = windowCapacity(start, end);
  if (cap > 0) _freeTimeMax = cap;
  const limit = document.getElementById('pref-proactive-limit');
  if (limit) {
    limit.max = String(_freeTimeMax);
    const current = Number(limit.value);
    if (Number.isFinite(current) && current > _freeTimeMax) {
      limit.value = String(_freeTimeMax);
    }
  }
  const hint = document.getElementById('pref-schedule-hint');
  if (hint) {
    const sleepLabel = (sleepStart && sleepEnd) ? `${sleepStart}–${sleepEnd}` : '01:00–08:00';
    const windowLabel = (start && end) ? `${start}–${end}` : '08:00–00:00';
    hint.textContent = `机会在 ${windowLabel} 内均匀分布并带随机抖动，安排数是当天要排的次数（默认 32，不是塞满窗口）。约 20% 的机会带上联网搜索。热聊中的到期机会会过期；中途调大会补足当天剩余时段。当前窗口最多 ${_freeTimeMax} 次。睡眠时段是 ${sleepLabel}。过了睡眠结束点会自动醒；醒了你还没开口时主动找你会变少。`;
  }
}

function toggleProactivePreference() {
  const enabled = document.getElementById('pref-proactive-enabled')?.checked;
  const limit = document.getElementById('pref-proactive-limit');
  if (limit) limit.disabled = !enabled;
}

async function savePreferences() {
  snapSleepHour(document.getElementById('pref-sleep-start'));
  snapSleepHour(document.getElementById('pref-sleep-end'));
  syncFreeTimeCap();
  const timezone = Number(document.getElementById('pref-timezone')?.value);
  const enabled = document.getElementById('pref-proactive-enabled')?.checked;
  const limit = Number(document.getElementById('pref-proactive-limit')?.value);
  const sleepStart = document.getElementById('pref-sleep-start')?.value;
  const sleepEnd = document.getElementById('pref-sleep-end')?.value;
  const ftStart = document.getElementById('pref-ft-start')?.value;
  const ftEnd = document.getElementById('pref-ft-end')?.value;
  const sleepHour = clockHour(sleepStart);
  const wakeHour = clockHour(sleepEnd);
  if (!Number.isFinite(timezone) || timezone < -12 || timezone > 14) {
    return showToast('时区必须在 UTC-12 到 UTC+14 之间');
  }
  if (sleepHour == null || wakeHour == null) {
    return showToast('睡眠时段只支持整点，例如 01:00');
  }
  if (sleepHour === wakeHour) {
    return showToast('睡眠开始和结束不能是同一个小时');
  }
  if (clockToMinutes(ftStart) == null) {
    return showToast('请填写 Free Time 开始时间');
  }
  if (clockToMinutes(ftEnd) == null) {
    return showToast('请填写 Free Time 结束时间');
  }
  if (ftStart === ftEnd || clockToMinutes(ftStart) === clockToMinutes(ftEnd)) {
    return showToast('Free Time 开始和结束不能相同');
  }
  if (enabled && (!Number.isInteger(limit) || limit < 1 || limit > _freeTimeMax)) {
    return showToast(`Free Time 思考次数必须是 1 到 ${_freeTimeMax} 的整数`);
  }
  try {
    await api('PUT', '/preferences', {
      TIMEZONE_OFFSET_HOURS: timezone,
      MAX_DAILY_FREE_TIME: enabled ? limit : 0,
      SLEEP_AFTER_HOUR: sleepHour,
      WAKE_EARLIEST_HOUR: wakeHour,
      FREE_TIME_AWAKE_START: ftStart,
      FREE_TIME_AWAKE_END: ftEnd,
    });
    showToast('✅ 偏好已保存');
    loaded.settings = false;
    loadSettings();
  } catch(e) {
    showToast('保存失败: ' + e.message);
  }
}

      : `<div style="font-size:13px;color:#e65100;margin-bottom:8px;display:flex;align-items:center;gap:8px">${statusIcon('warn')} 最近 24 小时有 ${errCount} 条错误</div><div id="diag-error-list"></div>`;

    if (errCount > 0) {
      api('GET', '/diagnostics/errors').then(data => {
        if (generation !== _systemRequestGeneration) return;
        const container = document.getElementById('diag-error-list');
        if (!container || !data.errors?.length) return;
        let content = '<div class="bot-log" style="max-height:180px;overflow:auto;margin-top:4px">';
        for (const error of data.errors.slice(-20)) {
          const color = ['ERROR', 'CRITICAL'].includes(error.level) ? '#e53935' : '#e65100';
          content += `<div style="margin-bottom:4px"><span style="color:${color}">[${esc(error.level)}]</span> <span style="color:#888">${esc(error.time)}</span> ${esc(error.name)} — ${esc(error.message)}`;
          if (error.traceback) content += `\n<span style="color:#c9544d;font-size:11px">${esc(error.traceback)}</span>`;
          content += '</div>';
        }
        container.innerHTML = content + '</div>';
      }).catch(() => {});
    }

    api('GET', '/models/health').then(data => {
      if (generation !== _systemRequestGeneration) return;
      const container = document.getElementById('model-health-content');
      if (!container) return;
      const tierEntries = Object.entries(data.tiers || {});
      if (!tierEntries.length) {
        container.innerHTML = '<span style="color:var(--text-soft)">暂无数据（Agent 启动后开始统计）</span>';
        return;
      }
      container.innerHTML = tierEntries.map(([tier, stats]) => {
        const rate = stats.success_rate;
        const color = rate < 0.7 ? 'var(--danger)' : rate < 0.9 ? '#e65100' : 'var(--success)';
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span class="badge" style="min-width:48px;text-align:center">${esc(tier)}</span><span style="color:${color};font-weight:600">${(rate*100).toFixed(1)}%</span><span style="color:var(--text-soft);font-size:12px">(${stats.total-stats.failures}/${stats.total})</span></div>`;
      }).join('');
    }).catch(() => {
      if (generation !== _systemRequestGeneration) return;
      const container = document.getElementById('model-health-content');
      if (container) container.textContent = '无法获取模型健康数据';
    });
  } catch(e) {
    if (generation !== _systemRequestGeneration) return;
    el.innerHTML = `<div class="card" style="color:var(--danger)">❌ ${esc(e.message)}</div>`;
  }
}

const VENDOR_PRESETS = [
  { vendor: 'openai',    label: 'OpenAI',    compatibleLabel: 'OpenAI-compatible', provider: 'openai', baseUrl: '',                        placeholder: 'gpt-4o' },
  { vendor: 'deepseek',  label: 'DeepSeek',  provider: 'openai',    baseUrl: 'https://api.deepseek.com/v1',                                placeholder: 'deepseek-chat', fixedBaseUrl: true },
  { vendor: 'gemini',    label: 'Gemini',    provider: 'openai',    baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/',    placeholder: 'gemini-2.5-flash', fixedBaseUrl: true },
  { vendor: 'anthropic', label: 'Anthropic', provider: 'anthropic', baseUrl: '',                                                           placeholder: 'claude-sonnet-4-20250514' },
  { vendor: 'compatible', label: 'OpenAI-compatible', provider: 'openai', baseUrl: '',                                                      placeholder: '' },
];

const EMB_VENDOR_PRESETS = [
  { vendor: 'openai',   label: 'OpenAI / 兼容接口', compatibleLabel: 'OpenAI 兼容接口', provider: 'openai', baseUrl: '', placeholder: 'text-embedding-3-small' },
  { vendor: 'azure',    label: 'Azure AI Foundry',  provider: 'openai',       baseUrl: 'https://RESOURCE.services.ai.azure.com/openai/v1', placeholder: '' },
  { vendor: 'dashscope', label: '阿里云百炼',        provider: 'openai',       baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', placeholder: '' },
  { vendor: 'none',     label: '禁用',              provider: 'none',         baseUrl: '',                            placeholder: '' },
];

function _normalizeUrl(u) {
  try {
    const parsed = new URL(u);
    return parsed.protocol.toLowerCase() + '//' + parsed.host.toLowerCase()
      + parsed.pathname.replace(/\/+$/, '');
  } catch (_) {
    return (u || '').replace(/\/+$/, '');
  }
}

function _isAzureOpenAIUrl(baseUrl) {
  try {
    const parsed = new URL(baseUrl);
    const host = parsed.hostname.toLowerCase();
    return (host.endsWith('.services.ai.azure.com') || host.endsWith('.openai.azure.com'))
      && parsed.pathname.toLowerCase().includes('/openai');
  } catch (_) {
    return false;
  }
}

function resolveVendorLabel(provider, baseUrl, presets) {
  presets = presets || VENDOR_PRESETS;
  const url = _normalizeUrl(baseUrl);
  if (presets.some(p => p.vendor === 'azure') && provider === 'openai' && _isAzureOpenAIUrl(baseUrl)) return 'Azure AI Foundry';
  for (const p of presets) {
    if (p.provider === provider && p.baseUrl) {
      if (url && url === _normalizeUrl(p.baseUrl)) return p.label;
    }
  }
  if (provider === 'anthropic') return 'Anthropic';
  if (provider === 'openai') {
    const generic = presets.find(p => p.provider === 'openai' && !p.baseUrl);
    if (!url) return generic ? generic.label : 'OpenAI';
    if (generic && generic.compatibleLabel) return generic.compatibleLabel;
  }
  if (provider === 'none') return '禁用';
  return '不支持';
}

function endpointHost(baseUrl) {
  if (!baseUrl) return '';
  try { return new URL(baseUrl).host; }
  catch (_) { return baseUrl; }
}

function resolveVendorKey(provider, baseUrl, presets) {
  presets = presets || VENDOR_PRESETS;
  const url = _normalizeUrl(baseUrl);
  if (presets.some(p => p.vendor === 'azure') && provider === 'openai' && _isAzureOpenAIUrl(baseUrl)) return 'azure';
  for (const p of presets) {
    if (p.provider === provider && p.baseUrl) {
      if (url && url === _normalizeUrl(p.baseUrl)) return p.vendor;
    }
  }
  if (provider === 'anthropic') return 'anthropic';
  if (provider === 'none') return 'none';
  if (provider === 'openai' && !url) return 'openai';
  if (provider === 'openai') return 'compatible';
  return 'openai';
}

function onVendorChange() {

  if (!preset) return;
  const urlEl = document.getElementById('mm-baseurl');

  const modelEl = document.getElementById('mm-model');
  urlEl.readOnly = !!preset.fixedBaseUrl;

  if (preset.fixedBaseUrl || preset.vendor === 'openai' || preset.vendor === 'anthropic'
      || !urlEl.value || urlEl.value === _lastAutoBaseUrl) {
    urlEl.value = preset.baseUrl;
    _lastAutoBaseUrl = preset.baseUrl;
  }
  if (preset.placeholder) {
    modelEl.placeholder = '例如 ' + preset.placeholder;
    if (!modelEl.value || modelEl.value === _lastAutoModel) {
      modelEl.value = preset.placeholder;
      _lastAutoModel = preset.placeholder;

  else {
    modelEl.placeholder = '';
    if (modelEl.value === _lastAutoModel) modelEl.value = '';

    urlEl.placeholder = 'https://api.example.com/v1';
    urlHelp.style.display = 'block';
    urlHelp.textContent = '填写 HTTPS API 根地址，不要包含 /chat/completions。兼容性以实际测试结果为准。';
